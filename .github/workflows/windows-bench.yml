name: Windows bench

on:
  push:
    branches: ["bench/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Checkout par défaut : core.autocrlf=true sur le runner Windows, comme sur un poste de contributeur.
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Fins de ligne dans l'arbre de travail
        continue-on-error: true
        shell: bash
        run: git ls-files --eol | head -20
      - name: Installation reproductible
        run: pnpm install --frozen-lockfile
      - name: Lint et format
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
