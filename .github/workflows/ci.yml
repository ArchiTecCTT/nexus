name: CI

on:
  push:
    branches: [main, dayif]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Installation reproductible (seuls les scripts de pnpm-workspace.yaml > allowBuilds s'exécutent)
        run: pnpm install --frozen-lockfile
      - name: Lint et format
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests
        # Les runners GitHub restreignent les user namespaces non privilégiés (AppArmor) : les tests bwrap y sont
        # ignorés explicitement. Ils restent obligatoires sur un poste de développement Ubuntu (ADR-001).
        env:
          NEXUS_T001_ALLOW_NO_BWRAP: "1"
          NEXUS_ALLOW_NO_USERNS: "1"
        run: pnpm test
